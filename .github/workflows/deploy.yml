name: Deploy BucketMeter

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 8797 -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -p 8797 ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            set -e

            cd ~/Desktop/Git/BucketMeter

            git pull origin main

            echo "Restarting service..."
            sudo systemctl restart bucketmeter

            echo "Done"
          EOF